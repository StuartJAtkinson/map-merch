version: 2

# Minor/patch updates are grouped into one PR per ecosystem so they land (and
# get rebased) together instead of piling up as a dozen stale one-liners.
# Majors stay ungrouped — those are the ones that actually break the build
# (typescript 5→7, three 0.184→0.185) and need looking at one at a time.
updates:
  # npm — frontend
  - package-ecosystem: npm
    directory: /frontend/cesium
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, javascript]
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # three >=0.185 drops examples/fonts/helvetiker_bold.typeface.json, which
    # viewer3d.ts imports for the 3D branding stamp. Pinned until that's replaced.
    ignore:
      - dependency-name: three
        versions: [">=0.185.0"]

  # pip — backend
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, python]
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types: [minor, patch]

  # GitHub Actions themselves
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, github-actions]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
